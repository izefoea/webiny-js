name: "Chromatic - Storybook Preview (Realistic PoC)"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  chromatic:
    if: github.event_name == 'workflow_dispatch' || github.event.comment.body == '/storybook'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install hub
        run: sudo apt-get install -y hub

      - name: Fetch PR details using hub
        id: fetch_pr
        if: github.event.issue.pull_request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ github.event.issue.number }}
          head_branch=$(hub pr show "$pr_number" -f '%H') # 获取 PR head 的 SHA
          echo "head_branch=$head_branch" >> $GITHUB_ENV

      - name: Checkout the PR's head branch (VULNERABLE, Pulling attacker code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || env.head_branch }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20 # 建议用 20，24 目前 setup-node 可能还不稳定

      - name: Install Dependencies (THE SINK: Executes malicious package.json)
        run: yarn

      - name: Build
        run: yarn build:quick

      # [被替换的步骤] 模拟 Chromatic 运行，暴露 Secret 被窃取的场景
      - name: Run Chromatic (Simulated)
        id: chromatic
        env:
          MOCK_SECRET_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 模拟原本传给 Chromatic 的高危 Secret
        run: |
          echo "If the attacker hijacked the 'yarn' step above, they have already stolen the token!"
          echo "storybookUrl=https://storybook.simulated.url/preview" >> $GITHUB_OUTPUT

      - name: Comment on PR with Storybook URL
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          body: |
            🚀 **Storybook Preview**
            You can preview the Storybook by visiting the link below:
            [Storybook Preview URL](${{ steps.chromatic.outputs.storybookUrl }})
